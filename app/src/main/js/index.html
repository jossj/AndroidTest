<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>AndroidTest</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #F8F9FF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }

    .screen {
      width: 360px;
      min-height: 640px;
      background: #F8F9FF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 40px 60px;
      gap: 0;
    }

    .phone-icon {
      width: 200px;
      height: 200px;
      margin-bottom: 32px;
      color: #4F46E5;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      color: #1A1A2E;
      text-align: center;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 15px;
      color: #6B7280;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 48px;
    }

    .btn-next {
      width: 100%;
      height: 56px;
      background: #4F46E5;
      color: #fff;
      border: none;
      border-radius: 28px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.15s;
    }

    .btn-next:hover { background: #4338CA; }
    .btn-next:active { background: #3730A3; }

    .btn-next svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <!-- Phone SVG icon -->
    <svg class="phone-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2" stroke="#4F46E5" stroke-width="1.5" fill="none"/>
      <line x1="5" y1="6" x2="19" y2="6" stroke="#4F46E5" stroke-width="1.5"/>
      <line x1="5" y1="18" x2="19" y2="18" stroke="#4F46E5" stroke-width="1.5"/>
      <circle cx="12" cy="21" r="0.5" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
      <rect x="9" y="4" width="6" height="1" rx="0.5" fill="#4F46E5"/>
    </svg>

    <div class="title">Welcome</div>
    <div class="subtitle">Your mobile experience starts here.<br>Powered by Android.</div>

    <button class="btn-next">
      Next
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </button>
  </div>
</body>
</html>
